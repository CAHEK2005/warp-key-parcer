[project]
name = "warp-key-orchestrator-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ansible-runner>=2.4.0",
    "apscheduler>=3.10.4",
    "bcrypt>=4.1.2",
    "celery>=5.3.6",
    "cryptography>=42.0.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.2.1",
    "psycopg[binary]>=3.1.18",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.1",
    "sqlalchemy>=2.0.28",
    "telethon>=1.34.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
